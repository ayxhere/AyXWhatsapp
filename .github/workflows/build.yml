name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fix AAPT2 launcher PNG compilation errors
      - name: Normalize launcher PNG resources
        run: |
          set -e
          python3 -m pip install --quiet Pillow

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import os

          root = Path("app/src/main/res")
          targets = list(root.glob("mipmap-*/ic_launcher*.png"))
          targets += list(root.glob("drawable*/ic_launcher*.png"))

          if not targets:
              raise SystemExit("No launcher PNG resources found")

          for path in targets:
              temp = path.with_name(path.stem + ".normalized.png")
              try:
                  with Image.open(path) as source:
                      source.load()
                      source.convert("RGBA").save(
                          temp, format="PNG", optimize=False
                      )

                  os.replace(temp, path)
                  print(f"Normalized: {path}")

              except Exception as exc:
                  if temp.exists():
                      temp.unlink()
                  raise SystemExit(
                      f"Invalid launcher image {path}: {exc}"
                  )
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK + CMake
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true

          install_pkgs() {
            sdkmanager \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              "ndk;26.3.11579264" \
              "cmake;3.22.1"
          }

          n=0
          until install_pkgs; do
            n=$((n+1))

            if [ "$n" -ge 4 ]; then
              echo "sdkmanager failed after $n attempts"
              exit 1
            fi

            echo "SDK install failed (attempt $n); retrying..."
            rm -rf \
              "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/26.3.11579264" \
              2>/dev/null || true
            sleep 8
          done

          test -d \
            "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/26.3.11579264" \
            || {
              echo "NDK missing after install"
              exit 1
            }

      - name: Download nodejs-mobile and place libnode.so
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          URL=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/digidem/nodejs-mobile/releases?per_page=15" \
            | grep browser_download_url \
            | grep -- '-android-' \
            | grep -v lite \
            | grep '\.zip' \
            | head -n1 \
            | cut -d '"' -f4)

          if [ -z "$URL" ]; then
            echo "No Android release asset found"
            exit 1
          fi

          echo "Downloading $URL"
          curl -fLsS -o node.zip "$URL"

          mkdir -p _node
          unzip -q node.zip -d _node

          SO=$(find _node \
            -path '*arm64-v8a*' \
            -name 'libnode.so' \
            -print -quit)

          if [ -z "$SO" ]; then
            echo "arm64-v8a/libnode.so not found in archive"
            exit 1
          fi

          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$SO" app/src/main/jniLibs/arm64-v8a/libnode.so

          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Install Node dependencies and bundle project
        run: |
          set -e

          cd nodejs-project
          npm install --omit=dev --no-audit --no-fund
          cd ..

          mkdir -p app/src/main/assets

          (
            cd nodejs-project
            zip -qr ../app/src/main/assets/nodejs-project.zip . \
              -x '*.git*'
          )

          ls -lh app/src/main/assets/
          du -sh app/src/main/assets/nodejs-project.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode signing keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          set -e

          echo "$KEYSTORE_B64" \
            | base64 -d > "$GITHUB_WORKSPACE/ayx.keystore"

          test -s "$GITHUB_WORKSPACE/ayx.keystore"

          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/ayx.keystore" \
            >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.KEYSTORE_B64 != ''
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ayx-whatsapp-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish signed release APK
        if: env.KEYSTORE_B64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          gh release create release \
            --title "Signed release" \
            --notes "AyX WhatsApp signed build" \
            2>/dev/null || true

          gh release upload release \
            app/build/outputs/apk/release/app-release.apk \
            --clobber
